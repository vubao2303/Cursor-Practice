<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Simple Todo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 2rem clamp(1rem, 4vw, 3rem);
        max-width: 560px;
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: flex;
        gap: 0.5rem;
      }

      input {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border-radius: 0.4rem;
        border: 1px solid rgba(0, 0, 0, 0.25);
      }

      button {
        padding: 0.5rem 1.2rem;
        border-radius: 0.4rem;
        border: none;
        cursor: pointer;
        background: #2563eb;
        color: white;
        font-weight: 600;
      }

      ul {
        list-style: none;
        padding: 0;
        margin-top: 1.5rem;
      }

      li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.4rem 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      }

      li button {
        margin-left: auto;
        background: transparent;
        color: inherit;
        border: none;
        font-size: 1rem;
        padding: 0.2rem 0.4rem;
      }

      .empty {
        color: rgba(0, 0, 0, 0.55);
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Todo List</h1>

    <form id="todo-form" aria-label="Add a task">
      <input id="todo-input" placeholder="Add a task" autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <p id="empty-state" class="empty">Nothing to do yet.</p>
    <ul id="todo-list" aria-live="polite"></ul>

    <script>
      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const list = document.getElementById('todo-list');
      const emptyState = document.getElementById('empty-state');

      function updateEmptyState() {
        emptyState.hidden = list.children.length > 0;
      }

      function buildItem(text) {
        const li = document.createElement('li');
        const label = document.createElement('span');
        label.textContent = text;

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.textContent = '✕';
        deleteBtn.setAttribute('aria-label', `Delete ${text}`);
        deleteBtn.addEventListener('click', () => {
          li.remove();
          updateEmptyState();
        });

        li.append(label, deleteBtn);
        return li;
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          return;
        }

        list.appendChild(buildItem(text));
        updateEmptyState();
        input.value = '';
        input.focus();
      });

      updateEmptyState();
    </script>
  </body>
</html>
