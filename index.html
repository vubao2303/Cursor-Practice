<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Todo List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <header class="app__header">
        <div>
          <p class="app__eyebrow">Vanilla JavaScript Project</p>
          <h1 id="app-title">Todo List</h1>
          <p class="app__subtitle">Keep track of everything in one tidy place.</p>
        </div>
        <div class="theme-toggle" role="group" aria-label="Theme toggle">
          <button type="button" data-theme="light" aria-pressed="true">☀️</button>
          <button type="button" data-theme="dark" aria-pressed="false">🌙</button>
        </div>
      </header>

      <section class="panel" aria-label="Create a new task">
        <label class="visually-hidden" for="task-input">Task name</label>
        <input
          id="task-input"
          type="text"
          name="task"
          placeholder="Add a new task and press Enter"
          autocomplete="off"
          maxlength="120"
        />
        <button id="add-task" type="button">Add</button>
      </section>

      <section class="panel panel--toolbar" aria-label="Task filters">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter is-active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="completed" type="button">Completed</button>
        </div>
        <button id="clear-completed" type="button">Clear completed</button>
      </section>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" role="status">
        You're all caught up. Add a task to get started!
      </p>
    </main>

    <template id="todo-item-template">
      <li class="todo" data-id="">
        <label class="todo__body">
          <input class="todo__checkbox" type="checkbox" />
          <span class="todo__text"></span>
        </label>
        <button class="todo__delete" type="button" aria-label="Delete task">✕</button>
      </li>
    </template>

    <script src="app.js" type="module"></script>
  </body>
</html>
